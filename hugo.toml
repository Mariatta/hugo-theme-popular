# Theme-level config, merged into every site that uses the theme (lower
# priority than the site's own config). Defines the LLMS (llms.txt) output
# format so a site can enable /llms.txt (§8) just by adding "LLMS" to its home
# [outputs], without redeclaring the format. (Hugo merges outputFormats from a
# theme, but not [outputs], so the home outputs stay a per-site choice.)

[outputFormats.LLMS]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

# The theme's own version, merged into every site as site.Params.popularVersion
# and shown in the footer next to the Popular credit. Bump on release.
[params]
  popularVersion = "0.10.0"
