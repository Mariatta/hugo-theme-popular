name = "Popular"
license = "MIT"
licenselink = "https://github.com/Mariatta/hugo-theme-popular/blob/main/LICENSE"
description = "Built to make your community seen and famous. A warm, community-first Hugo theme for meetups, user groups and small events: blog, events, organizers, and a docs area for handbooks & runbooks. Fully re-themeable from config."
homepage = "https://github.com/Mariatta/hugo-theme-popular"
demosite = "https://popular.mariatta.ca/"
tags = ["blog", "community", "meetup", "events", "docs", "responsive", "accessible"]
features = ["blog", "events", "organizers", "docs", "checklists", "config-theming"]
# Raising this floor? Three other places carry a Hugo version and none of
# them updates itself: README "Requirements", the image-alt.yml CI matrix,
# and HUGO_VERSION in the Netlify UI for the preview builds (that one is
# not in this repo at all, see AGENTS.md "Settings that live outside this repo").
min_version = "0.146.0"

[author]
  name = "Mariatta"
  homepage = "https://mariatta.ca"
