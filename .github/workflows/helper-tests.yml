name: Helper script tests

# Unit tests for the Python helper scripts (importers, sponsor updater).
# Standard library only: no dependencies to install.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 -m unittest discover -s scripts/tests -v
      - name: Parity check against astro-theme-popular
        run: |
          # Lockstep changes (a Tier-1 file added in both repos) use the SAME
          # branch name in both repos; prefer that branch on the sibling so
          # paired PRs check against each other, not against stale main.
          BRANCH="${{ github.head_ref || github.ref_name }}"
          # Say which ref we ended up comparing against. Without this a paired
          # PR whose sibling branch is not pushed yet fails as "DRIFT" on the
          # shared CHANGELOG, which reads like real drift and is not.
          if git clone --depth 1 -b "$BRANCH" https://github.com/Mariatta/astro-theme-popular ../astro-theme-popular; then
            echo "::notice::compared against astro-theme-popular branch $BRANCH"
          elif git clone --depth 1 https://github.com/Mariatta/astro-theme-popular ../astro-theme-popular; then
            echo "::warning::astro-theme-popular has no branch $BRANCH; compared against its default branch. If this is a paired PR, push the sibling branch and re-run."
          else
            echo "::notice::sibling repo not clonable; parity check skipped"; exit 0
          fi
          git -C ../astro-theme-popular log --oneline -1
          bash scripts/sync-shared.sh --check

  e2e-wizard:
    # End-to-end: run scripts/setup.py over a fresh copy of the starter with a
    # fixture answer file, then confirm the generated site builds and the
    # answers reached the rendered HTML.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: "latest"
          extended: true
      - name: Run the wizard over a fresh copy of the starter
        run: |
          cp -R exampleSite /tmp/site
          # No --force: an unedited starter's config and CoC page are pristine,
          # so the wizard adopts them. A regression would exit 1 here.
          POPULAR_SETUP_DATE=2026-08-03 python3 scripts/setup.py \
            --site /tmp/site \
            --answers scripts/tests/fixtures/answers-full.json | tee /tmp/wizard.out
          grep -q "Adopted unedited starter file" /tmp/wizard.out
      - name: Wizard wrote the config, seed, audit trail and answer record
        run: |
          test -f /tmp/site/DECISIONS.md
          test -f /tmp/site/.popular-setup.json
          grep -q "PyLadies Vancouver" /tmp/site/hugo.toml
          grep -q "coc@" /tmp/site/content/code-of-conduct.md
      - name: The generated site builds
        run: hugo --source /tmp/site --themesDir "$PWD/.." --theme hugo-theme-popular --minify
      - name: The answers reached the rendered HTML
        run: |
          grep -rq "PyLadies Vancouver" /tmp/site/public
          grep -rq "coc@" /tmp/site/public

