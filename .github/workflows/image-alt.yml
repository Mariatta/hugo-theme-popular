name: Images must have alt text

# Builds every site in the repo (docs site, exampleSite, four demos) and fails
# if any <img> in the output lacks a non-empty alt attribute, or any markdown
# image in content sources has empty alt text. See scripts/check-image-alt.py.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # latest plus the documented minimum supported version.
        # Changing the floor here means changing theme.toml, the README,
        # and HUGO_VERSION in the Netlify UI (preview builds; not in this
        # repo, see AGENTS.md).
        hugo-version: ["latest", "0.146.0"]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Hugo
        uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: ${{ matrix.hugo-version }}

      - name: Build all sites
        run: |
          THEME="$(basename "$GITHUB_WORKSPACE")"
          build () {  # build <source-dir> <dest-subdir>
            hugo --source "$1" \
                 --themesDir "$(realpath --relative-to="$1" "$GITHUB_WORKSPACE/..")" \
                 --theme "$THEME" \
                 --destination "$GITHUB_WORKSPACE/alt-check-out/$2"
          }
          build site site
          build exampleSite example
          build demos/rocky-cove-aquarium aquarium
          build demos/lucky-town-foodie foodie
          build demos/kdrama-fan-club kdrama
          build demos/truly-madly-riley superfan

      - name: No double-escaped ampersands
        run: |
          # &amp;amp; means a URL was HTML-escaped twice (breaks query-string
          # links); regression guard for the rel-href/safeHTML fix.
          # HTML only: RSS XML legitimately double-escapes HTML in descriptions.
          # Exclude the changelog page, which quotes a past double-escape bug.
          if grep -rl --include='*.html' --exclude-dir=changelog '&amp;amp;' alt-check-out; then
            echo "::error::double-escaped ampersand in built output"; exit 1
          fi
      - name: Check image alt text
        run: |
          python3 scripts/check-image-alt.py \
            alt-check-out \
            site/content exampleSite/content \
            demos/rocky-cove-aquarium/content \
            demos/lucky-town-foodie/content \
            demos/kdrama-fan-club/content
      - name: Validate JSON-LD
        run: python3 scripts/check-jsonld.py alt-check-out
      - name: Validate iCalendar feeds
        run: python3 scripts/check-ics.py alt-check-out

      - name: Subpath deployment (baseURL with a path)
        run: |
          # A Pages project site lives at user.github.io/repo/. Every internal
          # href and src must carry that path: relURL/relLangURL silently drop
          # it when the value starts with a slash, which is how front matter
          # written the Astro way ("/images/x.png") 404s here. rel-href.html
          # and rel-src.html exist to prevent exactly that.
          # (The deploy workflow has the same guard, but it no-ops on the
          # theme's own custom-domain deployment, so run it here too.)
          THEME="$(basename "$GITHUB_WORKSPACE")"
          sub () {  # sub <source-dir> <dest-subdir>
            hugo --source "$1" \
                 --themesDir "$(realpath --relative-to="$1" "$GITHUB_WORKSPACE/..")" \
                 --theme "$THEME" \
                 --baseURL "https://example.com/sub/" \
                 --destination "$GITHUB_WORKSPACE/subpath-out/$2"
          }
          sub exampleSite example
          sub demos/kdrama-fan-club kdrama
          leaks=$(grep -rhoE '(href|src)="/[^"]*"' subpath-out --include='*.html' \
                  | grep -vE '^(href|src)="/sub' | sort -u | head -20 || true)
          if [ -n "$leaks" ]; then
            echo "::error::internal link or asset missing the /sub base path:"; echo "$leaks"; exit 1
          fi
          # absolute URLs (canonical, og:image, JSON-LD, feeds) keep the subpath too
          grep -q '"url":"https://example.com/sub/"' subpath-out/example/index.html
          grep -q 'og:image" content="https://example.com/sub/' subpath-out/example/index.html
          grep -q 'https://example.com/sub/events/' subpath-out/example/llms.txt
          # markdown body links written "/handbook/" pick up the prefix
          grep -q 'href="/sub/handbook/"' subpath-out/example/runbooks/index.html
          python3 scripts/check-jsonld.py subpath-out
          python3 scripts/check-ics.py subpath-out

      - name: Empty state + notice banner (§5)
        run: |
          # A fixture site with no upcoming events must render the designed
          # empty state (home + events list) and the site-wide notice banner.
          THEME="$(basename "$GITHUB_WORKSPACE")"
          SRC=scripts/fixtures/empty-events
          hugo --source "$SRC" \
               --themesDir "$(realpath --relative-to="$SRC" "$GITHUB_WORKSPACE/..")" \
               --theme "$THEME" \
               --destination "$GITHUB_WORKSPACE/empty-state-out"
          out="$GITHUB_WORKSPACE/empty-state-out"
          # Notice banner: rendered, inline markdown applied, optional link present
          grep -q 'class="g-notice" role="status"' "$out/index.html"
          grep -q '<strong>Stay tuned</strong>' "$out/index.html"
          grep -q '>Learn more</a>' "$out/index.html"
          # Empty state on home and events list: message + calendar link + chat CTA
          for page in index.html events/index.html; do
            grep -q 'g-empty' "$out/$page"
            grep -q 'follow us to hear when the next one lands' "$out/$page"
            grep -q 'events/calendar.ics' "$out/$page"
            grep -q 'Join our chat' "$out/$page"
          done
